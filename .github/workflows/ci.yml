# CI de GrowFlow: en cada push y pull request a main corre lo mismo que se
# exige antes de dar algo por terminado (CLAUDE.md): tests, lint y build
# (el build incluye `tsc -b`, que es el que caza imports sin usar).
#
# No deploya: el deploy lo hace Cloudflare Pages solo al pushear a main.
# Esto avisa si lo que se pusheo esta roto, antes de descubrirlo en el sitio.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (vitest)
        run: npm test

      - name: Lint (0 errores; los warnings son la linea base)
        run: npm run lint

      - name: Build (tsc -b + vite)
        run: npm run build

  # Las specs de OpenSpec (openspec/specs y openspec/changes) son el contrato de
  # cada cambio de comportamiento: una spec mal formada —un requisito sin
  # escenario, un delta que no aplica— tiene que frenar el PR igual que un test
  # rojo. Job aparte: no necesita node_modules de la app y corre en paralelo.
  # La version va fijada para que una release nueva no cambie las reglas sola.
  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar specs (openspec validate --strict)
        run: npx --yes @fission-ai/openspec@1.14.1 validate --all --strict --no-interactive
