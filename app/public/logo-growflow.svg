<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="hoja" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#65a30d"/>
      <stop offset="0.55" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#d9f99d"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="#0a0a0f"/>
  <rect x="3" y="3" width="250" height="250" rx="55" fill="none" stroke="#404d20" stroke-width="3"/>
  <circle cx="128" cy="116" r="110" fill="url(#halo)"/>
  <!-- la hoja: crece hacia arriba a la derecha -->
  <path d="M86 178 C 66 128, 92 74, 186 58 C 196 132, 160 176, 104 180 Z" fill="url(#hoja)"/>
  <!-- nervadura central -->
  <path d="M92 184 C 116 150, 142 118, 172 80" fill="none" stroke="#0a0a0f" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <!-- el flujo: dos ondas que salen de la base -->
  <path d="M52 204 C 82 188, 104 212, 134 198 S 186 186, 206 198" fill="none" stroke="#bef264" stroke-width="9" stroke-linecap="round"/>
  <path d="M70 226 C 96 214, 116 232, 142 222 S 180 214, 194 222" fill="none" stroke="#bef264" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- el punto de "en vivo" -->
  <circle cx="196" cy="54" r="11" fill="#bef264"/>
  <circle cx="196" cy="54" r="19" fill="none" stroke="#bef264" stroke-width="3" opacity="0.35"/>
</svg>
